<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>河北 · 红色纪行</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./icons-shim.css">
    <link rel="stylesheet" href="./theme-dark.css">
    <link rel="stylesheet" href="./ai-assistant.css">
    <style>
        body { min-height: 100vh; }
        .province-top {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 8vw; border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(5,7,13,0.7); backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 50;
        }
        .province-top a { color: #9fb6cc; text-decoration: none; font-size: .9rem; letter-spacing: .08em; }
        .province-top a:hover { color: #ff4d94; }
        .province-tag { font-size: .75rem; letter-spacing: .3em; color: #ff4d94; }
        .province-hero { padding: 90px 8vw 40px; max-width: 1080px; }
        .province-kicker { color: #5fd0ff; letter-spacing: .32em; font-size: .8rem; margin-bottom: 14px; }
        .province-hero h1 { font-size: clamp(2rem, 4vw, 3rem); color: #fff; margin: 0 0 18px; letter-spacing: .06em; }
        .province-hero h1 i { color: #ff4d94; text-shadow: 0 0 18px rgba(255,77,148,.8); margin-right: 12px; }
        .province-hero p.lead { color: #a8bdcd; line-height: 1.9; max-width: 720px; margin: 0 0 36px; }
        .province-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; padding: 0 8vw 80px; max-width: 1080px; }
        .province-card {
            border-radius: 16px; padding: 22px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(14px);
        }
        .province-card h3 { color: #e8f2fb; margin: 0 0 10px; font-size: 1.05rem; letter-spacing: .05em; }
        .province-card h3 i { color: #ff4d94; margin-right: 8px; }
        .province-card p { color: #8fa3bf; line-height: 1.8; font-size: .9rem; margin: 0; }
        .province-note { padding: 0 8vw 90px; color: #62788f; letter-spacing: .12em; font-size: .8rem; }
        .province-note i { color: #5fd0ff; margin-right: 8px; }
        .province-map-section { padding: 0 8vw 40px; max-width: 1080px; }
        .province-map-title {
            color: #e8f2fb; font-size: 1.2rem; letter-spacing: .08em;
            margin: 0 0 16px; display: flex; align-items: center; gap: 8px;
        }
        .province-map-layout {
            display: grid;
            grid-template-columns: 62% minmax(0, 1fr);
            gap: 16px;
            align-items: start;
        }
        .province-map-canvas {
            width: 100%; height: 480px;
            border-radius: 16px; overflow: hidden;
            background: rgba(13, 44, 74, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* ---------- 右侧地标详情面板 ---------- */
        .province-detail {
            position: sticky; top: 96px;
            height: 480px; min-height: 480px;
            overflow-y: auto;
            border-radius: 16px;
            padding: 22px 22px 26px;
            background:
                radial-gradient(600px 300px at 88% 6%, rgba(255,51,85,0.10), transparent 65%),
                rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.10);
            backdrop-filter: blur(14px);
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.18) transparent;
        }
        .province-detail::-webkit-scrollbar { width: 6px; }
        .province-detail::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }
        .pd-placeholder {
            height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px;
            color: #62788f; text-align: center; letter-spacing: .1em;
            font-size: .88rem; line-height: 1.9; padding-top: 70px;
        }
        .pd-placeholder i { font-size: 2rem; color: #ff5c5c; opacity: .75; }
        .pd-placeholder p { margin: 0; }
        .pd-tag {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: .72rem; letter-spacing: .18em; color: #ff9a9a;
            padding: 3px 10px; border-radius: 999px;
            background: rgba(255, 51, 85, 0.12);
            border: 1px solid rgba(255, 51, 85, 0.35);
        }
        .pd-tag i { font-size: .7rem; color: #ff5c5c; }
        .pd-title { color: #f2f7fc; font-size: 1.25rem; margin: 14px 0 6px; letter-spacing: .06em; line-height: 1.4; }
        .pd-type { color: #5fd0ff; font-size: .76rem; letter-spacing: .04em; }
        .pd-divider { height: 1px; margin: 16px 0; background: linear-gradient(90deg, rgba(255,51,85,.55), rgba(95,208,255,.15), transparent); }
        .pd-intro { color: #c3d3e2; font-size: .9rem; line-height: 1.95; margin: 0 0 16px; text-indent: 2em; }
        .pd-sub {
            color: #e8f2fb; font-size: .92rem; margin: 20px 0 10px;
            display: flex; align-items: center; gap: 8px; letter-spacing: .08em;
        }
        .pd-sub i { color: #ff8a3c; font-size: .88rem; }
        .pd-history { color: #a8bdcd; font-size: .86rem; line-height: 1.95; margin: 0; text-indent: 2em; }
        .pd-notes { margin: 0; padding: 0 0 0 4px; list-style: none; }
        .pd-notes li {
            position: relative; padding-left: 18px; margin-bottom: 8px;
            color: #8fa3bf; font-size: .84rem; line-height: 1.85;
        }
        .pd-notes li::before {
            content: ""; position: absolute; left: 2px; top: .62em;
            width: 6px; height: 6px; border-radius: 50%;
            background: #ff5c5c; box-shadow: 0 0 8px rgba(255,92,92,.8);
        }
        .pd-meta {
            margin-top: 22px; padding-top: 16px;
            border-top: 1px dashed rgba(255,255,255,0.12);
            display: flex; flex-direction: column; gap: 10px;
        }
        .pd-meta-item { display: flex; align-items: baseline; gap: 8px; font-size: .8rem; line-height: 1.6; }
        .pd-meta-item i { color: #5fd0ff; width: 14px; flex-shrink: 0; font-size: .78rem; }
        .pd-meta-item span { color: #62788f; flex-shrink: 0; letter-spacing: .1em; }
        .pd-meta-item em { color: #a8bdcd; font-style: normal; }
        @media (max-width: 900px) {
            .province-map-layout { grid-template-columns: 1fr; }
            .province-detail { position: static; height: auto; min-height: 0; }
            .pd-placeholder { padding: 40px 0; }
        }
        @media (max-width: 768px) {
            .province-map-canvas { height: 360px; }
        }
    </style>
</head>
<body>
    <header class="province-top">
        <a href="index.html#red-map"><i class="fa-solid fa-arrow-left"></i> 返回红色星图</a>
        <span class="province-tag">RED ARCHIVE · 河北</span>
    </header>
    <main class="province-hero">
        <div class="province-kicker">河北 · 红色纪行</div>
        <h1><i class="fa-solid fa-landmark"></i>河北红色文化专区</h1>
        <p class="lead">太行山下的西柏坡，是“新中国从这里走来”的地方；大钊故里、狼牙山、白洋淀……燕赵大地上处处镌刻着红色记忆。本页面为河北专属档案的入口，内容将持续补充。</p>
    </main>
    <div class="province-map-section">
        <h2 class="province-map-title"><i class="fa-solid fa-map-location-dot"></i> 红色地标分布</h2>
        <div class="province-map-layout">
            <div id="provinceMap" class="province-map-canvas"></div>
            <aside id="provinceDetail" class="province-detail" aria-live="polite"></aside>
        </div>
    </div>
    <section class="province-cards">
        <div class="province-card">
            <h3><i class="fa-solid fa-location-dot"></i>红色地标</h3>
            <p>西柏坡纪念馆、李大钊故居、狼牙山五勇士陈列馆、白洋淀雁翎队纪念馆……后续将在此展示景点介绍与参观信息。</p>
        </div>
        <div class="province-card">
            <h3><i class="fa-solid fa-hourglass-half"></i>历史坐标</h3>
            <p>从建党先驱的足迹，到党中央在西柏坡指挥三大战役，梳理河北的红色历史时间线。</p>
        </div>
        <div class="province-card">
            <h3><i class="fa-solid fa-flag"></i>精神传承</h3>
            <p>红色故事、人物事迹与当代传承活动，敬请期待。</p>
        </div>
    </section>
    <p class="province-note"><i class="fa-solid fa-circle-info"></i>页面建设中 · 后续将补充影像、导览与互动内容</p>
    <script src="./province-detail.js"></script>
    <script>
    (function () {
        'use strict';

        // ===================== 每页只改这几项 =====================
        var MAP_KEY       = 'hebei';                   // ECharts 注册的地图名
        var ADCODE        = '130000';                  // 阿里云 DataV 行政区划代码
        var PROVINCE_NAME = '河北';                     // echarts china.json 中的省份名（兜底数据用）
        var BORDER_CLR    = '#ff4d94';                 // 省界描边色
        var BORDER_TYPE   = 'dotted';                  // 省界线型
        var GLOW_CLR      = 'rgba(255,77,148,0.35)';   // 省界外发光
        var AREA_BASE     = 'rgba(13,44,74,0.55)';     // 常态填充
        var AREA_HOT      = 'rgba(255,77,148,0.18)';   // 悬浮填充
        var LABEL_CLR     = 'rgba(150,221,255,0.55)';  // 区域名称颜色
        var LABEL_HOT_CLR = '#ff99c8';                 // 悬浮时区域名称颜色

        // ===================== 每页只改这个数组（该省博物馆点位）=====================
        var POINTS = [
            { name: '西柏坡纪念馆',         value: [113.95, 38.35] },
            { name: '冉庄地道战遗址',       value: [115.45, 38.68] },
            { name: '狼牙山五壮士陈列馆',   value: [115.25, 39.15] },
            { name: '李大钊纪念馆',         value: [118.90, 39.42] },
            { name: '晋察冀边区革命纪念馆', value: [114.20, 38.85] }
        ];

        var host = document.getElementById('provinceMap');
        if (!host) return;

        // ------------------------------------------------------------
        // 资源加载
        //   1) 优先用「本站同源」文件：./echarts.min.js + ./maps/xxx.json
        //      —— 不经过 CDN、也不带站外 Referer，线上最稳，基本秒开
        //   2) 同源文件缺失时，再依次尝试 CDN / 阿里云 DataV / echarts china.json
        //   注意：阿里云 geo.datav.aliyun.com 有防盗链，带「站外 Referer」访问会返回 403。
        //         本地 file:// 打开没有 Referer、localhost 又在白名单里，所以本地一直正常，
        //         但放到公网域名后 DataV 会 403，地图就一直停在「加载中」。
        // ------------------------------------------------------------
        var LOCAL_ECHARTS = './echarts.min.js';        // 本站 ECharts（同源）
        var LOCAL_GEO     = './maps/hebei.json';       // 本站本省地图数据（同源）
        var NET_TIMEOUT   = 8000;                      // 单个网络源超时（毫秒），超时立即换下一个源

        var ECHARTS_CDN = [
            'https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js',
            'https://unpkg.com/echarts@5.5.0/dist/echarts.min.js',
            'https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js'
        ];
        // 本省地图数据：阿里云 DataV（完整版 → 边界版），仅作同源数据缺失时的兜底
        var PROVINCE_GEO_CDN = [
            'https://geo.datav.aliyun.com/areas_v3/bound/' + ADCODE + '_full.json',
            'https://geo.datav.aliyun.com/areas_v3/bound/' + ADCODE + '.json'
        ];
        // 最后兜底：从 echarts 官方 china.json 中抽出本省
        var CHINA_GEO_CDN = [
            'https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/json/china.json',
            'https://unpkg.com/echarts@4.9.0/map/json/china.json'
        ];

        function showTip(html) {
            host.innerHTML = '<p style="color:#62788f;text-align:center;padding-top:180px;' +
                'letter-spacing:.1em;font-size:.85rem;line-height:1.9;">' + html + '</p>';
        }

        // 带超时的脚本加载：卡住也算失败，直接换下一个源
        function loadScript(src, timeout) {
            return new Promise(function (resolve, reject) {
                var s = document.createElement('script');
                var settled = false;
                var timer = setTimeout(function () {
                    if (settled) return;
                    settled = true;
                    reject(new Error('script timeout: ' + src));
                }, timeout || NET_TIMEOUT);
                s.src = src;
                s.async = true;
                s.onload = function () {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    resolve();
                };
                s.onerror = function () {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    reject(new Error('script load failed: ' + src));
                };
                document.head.appendChild(s);
            });
        }

        function loadEChartsLib() {
            if (window.echarts) return Promise.resolve(window.echarts);
            // 同源副本优先，其次 CDN
            var sources = [LOCAL_ECHARTS].concat(ECHARTS_CDN);
            var i = 0;
            function next() {
                if (i >= sources.length) return Promise.reject(new Error('ECharts 加载失败（本站文件与 CDN 均不可用）'));
                var src = sources[i++];
                return loadScript(src).then(function () {
                    if (window.echarts) return window.echarts;
                    return next();
                }, function () {
                    return next();
                });
            }
            return next();
        }

        // 带超时的 JSON 拉取：下载卡住时立刻失败，去试下一个源
        function fetchJson(url, timeout, cacheMode) {
            var opts = { cache: cacheMode || 'force-cache' };
            var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
            if (ctrl) opts.signal = ctrl.signal;
            var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, timeout || NET_TIMEOUT) : null;
            function done() {
                if (timer) { clearTimeout(timer); timer = null; }
            }
            return fetch(url, opts).then(function (r) {
                done();
                if (!r.ok) throw new Error('HTTP ' + r.status + ' · ' + url);
                return r.json();
            }, function (err) {
                done();
                throw err;
            });
        }

        // 依次尝试多个数据源，返回第一个通过校验的结果
        function tryEach(urls, check) {
            var i = 0;
            function next() {
                if (i >= urls.length) return Promise.reject(new Error('全部数据源均不可用'));
                var url = urls[i++];
                return fetchJson(url).then(function (data) {
                    var ok = check ? check(data) : data;
                    if (!ok) throw new Error('数据为空 · ' + url);
                    return ok;
                }).catch(function () {
                    return next();
                });
            }
            return next();
        }

        function checkProvinceGeo(data) {
            if (!data || !data.features || !data.features.length) return null;
            return data;
        }

        // 从全国 china.json 中抽出本省要素，拼成只含本省的 GeoJSON
        function provinceFromChina(china) {
            if (!china || !china.features || !china.features.length) return null;
            for (var i = 0; i < china.features.length; i++) {
                var f = china.features[i];
                if (f && f.properties && f.properties.name === PROVINCE_NAME) {
                    return { type: 'FeatureCollection', features: [f] };
                }
            }
            return null;
        }

        function loadProvinceGeo() {
            // 1) 本站同源数据（不联网、不受防盗链影响）→ 2) DataV → 3) china.json 抽省
            return fetchJson(LOCAL_GEO, 6000, 'default').then(function (data) {
                var local = checkProvinceGeo(data);
                if (!local) throw new Error('本站地图数据为空 · ' + LOCAL_GEO);
                return local;
            }).catch(function () {
                return tryEach(PROVINCE_GEO_CDN, checkProvinceGeo).catch(function () {
                    return tryEach(CHINA_GEO_CDN, provinceFromChina);
                });
            }).catch(function () {
                throw new Error('省级地图数据加载失败（本站缺少 ' + LOCAL_GEO + '，网络源也不可用）');
            });
        }

        // ------------------------------------------------------------
        // ECharts 配置（沿用首页“科技风 + 红色系”写法）
        // ------------------------------------------------------------
        function buildOption() {
            return {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(6, 12, 22, 0.92)',
                    borderColor: BORDER_CLR,
                    borderWidth: 1,
                    padding: [10, 14],
                    textStyle: { color: '#dbe9f6', fontSize: 12, lineHeight: 20 },
                    extraCssText: 'backdrop-filter: blur(8px); box-shadow: 0 0 24px ' + GLOW_CLR + ';',
                    formatter: function (p) {
                        if (!p || !p.name) return '';
                        var title = '<div style="font-weight:700;letter-spacing:.08em;color:#fff;font-size:13px;' +
                            'text-shadow:0 0 12px ' + GLOW_CLR + ';">' + p.name + '</div>';
                        if (p.seriesType === 'scatter') {
                            return title + '<div style="margin-top:4px;color:#9fb6cc;">点击查看该地标的红色档案</div>';
                        }
                        return title;
                    }
                },
                geo: {
                    map: MAP_KEY,
                    roam: false,
                    zoom: 1.02,
                    layoutCenter: ['50%', '50%'],
                    layoutSize: '98%',
                    label: {
                        show: true,
                        color: LABEL_CLR,
                        fontSize: 10,
                        letterSpacing: 2
                    },
                    itemStyle: {
                        areaColor: AREA_BASE,
                        borderColor: BORDER_CLR,
                        borderWidth: 1.5,
                        borderType: BORDER_TYPE,
                        shadowColor: GLOW_CLR,
                        shadowBlur: 14
                    },
                    emphasis: {
                        itemStyle: {
                            areaColor: AREA_HOT,
                            borderColor: BORDER_CLR,
                            borderWidth: 2.4,
                            shadowColor: GLOW_CLR,
                            shadowBlur: 30
                        },
                        label: { show: true, color: LABEL_HOT_CLR, fontSize: 12, fontWeight: 700 }
                    }
                },
                series: [{
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    data: POINTS,
                    symbolSize: 12,
                    itemStyle: {
                        color: '#ff3b3b',
                        borderColor: '#ffffff',
                        borderWidth: 1.5,
                        shadowBlur: 10,
                        shadowColor: 'rgba(255,59,59,0.9)'
                    },
                    label: {
                        show: true,
                        formatter: '{b}',
                        position: 'right',
                        color: '#e8f2fb',
                        fontSize: 11,
                        textBorderColor: 'rgba(0,0,0,0.65)',
                        textBorderWidth: 2
                    },
                    emphasis: {
                        label: { show: true, fontSize: 13, fontWeight: 'bold' },
                        itemStyle: { color: '#ff6b6b' }
                    }
                }]
            };
        }

        function initChart(echartsLib, geoJson) {
            echartsLib.registerMap(MAP_KEY, geoJson);
            host.innerHTML = '';
            var chart = echartsLib.init(host, null, { renderer: 'canvas' });
            chart.setOption(buildOption());
            window.__provinceMapChart = chart;

            var resize = function () { chart.resize(); };
            window.addEventListener('resize', resize);
            if (window.ResizeObserver && host.parentElement) {
                new ResizeObserver(resize).observe(host.parentElement);
            }

            // 点击地标 → 右侧文字档案（保持原有交互不变）
            if (window.ProvinceDetail) window.ProvinceDetail.bind(chart);
        }

        showTip('正在接入红色星图 · 加载地图数据');
        loadEChartsLib()
            .then(function (echartsLib) {
                return loadProvinceGeo().then(function (geo) {
                    return { lib: echartsLib, geo: geo };
                });
            })
            .then(function (res) { initChart(res.lib, res.geo); })
            .catch(function (err) {
                console.warn('[province-map]', err);
                showTip('地图资源加载失败：' + (err.message || '未知错误') +
                    '<br>本页优先读取同源文件（./echarts.min.js、./maps/），请确认这些文件已随页面一起上传，然后刷新重试');
            });
    })();
    </script>
    <script src="./ai-assistant.js"></script>
</body>
</html>
